<!DOCTYPE html>
<html>
<head>
    <title>OSINT Evidence Capture Tool</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav>
        <h2>🔍 OSINT Evidence Capture Tool</h2>
        <a href="{{ url_for('index') }}">Dashboard</a>
        <a href="{{ url_for('upload') }}">+ New Evidence</a>
    </nav>
    <div class="container">
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for msg in messages %}
                    <div class="flash">{{ msg }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
