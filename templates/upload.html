{% extends "_layout.html" %}
{% block content %}
<div class="card">
 <h2>Upload evidence file</h2>
 <form method="post" enctype="multipart/form-data">
  <label>File</label><input type="file" name="file" required>
  <label>Evidence type</label>
  <select name="evidence_type">{% for t in EVIDENCE_TYPES %}<option>{{ t }}</option>{% endfor %}</select>
  <label>Source URL</label><input name="source_url" placeholder="https://…">
  <label>Description</label><textarea name="description" rows="3"></textarea>
  <label>Admiralty - source reliability</label>
  <select name="admiralty_source" required>{% for v,l in ADMIRALTY_SOURCE %}<option value="{{ v }}">{{ l }}</option>{% endfor %}</select>
  <label>Admiralty - information credibility</label>
  <select name="admiralty_info" required>{% for v,l in ADMIRALTY_INFO %}<option value="{{ v }}">{{ l }}</option>{% endfor %}</select>
  <p><button>Hash, timestamp and log</button></p>
 </form>
</div>
{% endblock %}
